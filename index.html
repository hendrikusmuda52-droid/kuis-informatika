<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberQuest: Profil Belajar & Dashboard Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

  <!-- Tombol Login Guru Top Bar -->
  <div class="fixed top-4 left-4 z-50">
    <button onclick="openTeacherModal()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-500/40 rounded-xl text-xs font-bold text-amber-400 flex items-center gap-2 shadow-lg">
      <i data-lucide="shield-check" class="w-4 h-4"></i> Mode Guru
    </button>
  </div>

  <!-- Container Game Siswa -->
  <div id="game-container" class="w-full max-w-xl bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl relative">
    <div id="screen-start" class="text-center space-y-4">
      <h1 class="text-2xl font-black text-amber-400">CYBERQUEST INFORMATIKA</h1>
      <p class="text-xs text-slate-400">Isi identitasmu untuk memulai kuis diagnostik 50 pertanyaan!</p>
      <input id="input-name" type="text" placeholder="Nama Lengkap" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm outline-none focus:border-amber-400">
      <input id="input-class" type="text" placeholder="Kelas (contoh: 8-A)" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm outline-none focus:border-amber-400">
      <button onclick="startGame()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-sm">MULAI GAME 🚀</button>
    </div>

    <div id="screen-quiz" class="hidden space-y-4">
      <div class="flex justify-between text-xs text-amber-400 font-bold">
        <span id="text-step">Misi 1/50</span>
        <span id="text-percent">0%</span>
      </div>
      <h2 id="text-question" class="text-sm font-bold text-slate-200">Pertanyaan...</h2>
      <div id="container-options" class="space-y-2"></div>
    </div>

    <div id="screen-result" class="hidden text-center space-y-3">
      <h2 class="text-xl font-black text-emerald-400">Misi Selesai! 🎉</h2>
      <p class="text-xs text-slate-300">Jawabanmu sudah tersimpan di database guru.</p>
    </div>
  </div>

  <!-- Modal Login Guru -->
  <div id="modal-teacher" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/30 p-6 rounded-2xl w-full max-w-md relative space-y-4">
      <button onclick="closeTeacherModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
      <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2">
        <i data-lucide="lock" class="w-5 h-5"></i> Akses Portal Guru
      </h3>
      
      <div id="teacher-login-form" class="space-y-3">
        <input id="teacher-pass" type="password" placeholder="Masukkan Password Guru" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white outline-none">
        <button onclick="verifyTeacherPass()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs">MASUK DASHBOARD</button>
        <button onclick="forgotPassword()" class="w-full text-center text-xs text-slate-400 hover:underline">Lupa Password?</button>
      </div>

      <!-- Dashboard Hasil Siswa -->
      <div id="teacher-dashboard" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-300 font-bold">Data Hasil Siswa</span>
          <button onclick="exportToExcel()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold flex items-center gap-1">
            <i data-lucide="download" class="w-4 h-4"></i> Unduh Excel (.xlsx)
          </button>
        </div>
        <div class="max-h-60 overflow-y-auto border border-slate-800 rounded-xl">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-800 text-amber-400 sticky top-0">
              <tr>
                <th class="p-2">Nama</th>
                <th class="p-2">Kelas</th>
                <th class="p-2">Hasil</th>
              </tr>
            </thead>
            <tbody id="table-body-responses"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://umzuvwyefzfoonurykon.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ZuLbNeARGKVHjB2jVQjrAQ_QF-4p2c1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Password Guru Default
    let teacherPassword = localStorage.getItem('teacher_pass') || 'guru123';
    const teacherEmail = 'hendrikusmuda52@guru.smp.belajar.id';

    const questions = Array.from({length: 50}, (_, i) => ({
      id: i + 1,
      text: `Pertanyaan Misi ${i + 1}: Pilihan strategi belajar terbaikmu?`,
      opts: ["A. Praktik Komputer", "B. Gambar & Video", "C. Diskusi Kelompok", "D. Membaca Teks"]
    }));

    let currentIdx = 0;
    let userAnswers = {};
    let studentInfo = {};
    let fetchedData = [];

    function startGame() {
      const name = document.getElementById('input-name').value;
      const cls = document.getElementById('input-class').value;
      if(!name || !cls) return alert('Isi Nama dan Kelas!');
      studentInfo = { name, class: cls };
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-quiz').classList.remove('hidden');
      renderQ();
    }

    function renderQ() {
      const q = questions[currentIdx];
      document.getElementById('text-step').innerText = `Misi ${currentIdx + 1}/50`;
      document.getElementById('text-percent').innerText = `${Math.round(((currentIdx+1)/50)*100)}%`;
      document.getElementById('text-question').innerText = q.text;
      const container = document.getElementById('container-options');
      container.innerHTML = '';
      q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-3 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-left text-xs font-semibold rounded-xl border border-slate-700 transition";
        btn.innerText = opt;
        btn.onclick = () => {
          userAnswers[`q_${q.id}`] = opt;
          if(currentIdx < 49) { currentIdx++; renderQ(); } else { submitData(); }
        };
        container.appendChild(btn);
      });
    }

    async function submitData() {
      document.getElementById('screen-quiz').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');
      await supabaseClient.from('responses').insert([{
        student_name: studentInfo.name,
        student_class: studentInfo.class,
        answers: userAnswers,
        learning_style_summary: "Visual-Practical Strategist"
      }]);
    }

    function openTeacherModal() { document.getElementById('modal-teacher').classList.remove('hidden'); }
    function closeTeacherModal() { document.getElementById('modal-teacher').classList.add('hidden'); }

    async function verifyTeacherPass() {
      const input = document.getElementById('teacher-pass').value;
      if(input === teacherPassword) {
        document.getElementById('teacher-login-form').classList.add('hidden');
        document.getElementById('teacher-dashboard').classList.remove('hidden');
        loadStudentResponses();
      } else {
        alert('Password salah!');
      }
    }

    function forgotPassword() {
      alert(`Petunjuk Pemulihan Password:\nPassword bawaan Anda saat ini adalah: "${teacherPassword}".\nJika Anda ingin mengubahnya, password ini terasosiasi dengan akun email guru: ${teacherEmail}.`);
    }

    async function loadStudentResponses() {
      const { data, error } = await supabaseClient.from('responses').select('*').order('created_at', { ascending: false });
      if(data) {
        fetchedData = data;
        const tbody = document.getElementById('table-body-responses');
        tbody.innerHTML = data.map(r => `
          <tr class="border-b border-slate-800">
            <td class="p-2 font-bold">${r.student_name}</td>
            <td class="p-2">${r.student_class}</td>
            <td class="p-2 text-emerald-400">${r.learning_style_summary || 'Visual'}</td>
          </tr>
        `).join('');
      }
    }

    function exportToExcel() {
      if(!fetchedData.length) return alert('Belum ada data siswa.');
      const formatted = fetchedData.map(r => ({
        Waktu: new Date(r.created_at).toLocaleString('id-ID'),
        Nama: r.student_name,
        Kelas: r.student_class,
        Gaya_Belajar: r.learning_style_summary,
        Jawaban_JSON: JSON.stringify(r.answers)
      }));
      const ws = XLSX.utils.json_to_sheet(formatted);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Hasil_Siswa");
      XLSX.writeFile(wb, "Hasil_Asesmen_Siswa.xlsx");
    }

    window.onload = () => lucide.createIcons();
  </script>
</body>
</html>
